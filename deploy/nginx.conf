# Put this file in /etc/nginx/conf.d/pixel-link.conf (inside nginx's http context).
# Replace the domain and certificate paths before enabling the HTTPS server.
map $http_upgrade $pixel_link_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nes.example.com;
    ssl_certificate /etc/letsencrypt/live/nes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:4178;
        proxy_http_version 1.1;
        # Preserve the original Host, including a non-standard HTTPS port:
        # the application checks WebSocket Origin against Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pixel_link_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
